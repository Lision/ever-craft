canvas: {width: 1080, height: 1440}
typography:
  family: Maple Mono NF CN
  regular_path: null
  bold_path: null
palette:
  background: "#FAFAF8"
  surface: "#F0F0EE"
  ink: "#0A0A08"
  solid: "#000000"
  accent: "#012FA7"
  annotation: "#854953"
  muted: "#747472"
  divider: "#D1D1CF"
layout:
  margin_x: 80
  margin_top: 72
  margin_bottom: 72
  block_gap: 24
  copy_to_divider_gap: 24
  divider_to_illustration_gap: 20
  illustration_to_footer_gap: 40
  min_illustration_share: 0.5
illustration:
  character_enabled: true
  prohibited: [photorealism, 3d rendering, copied reference mascot]
typography_scale:
  cover_title: 90
  standard_title: 72
  kicker: 24
  subtitle: 30
  body: 34
  emphasis: 28
  footer: 22
line_spacing: {title: 18, subtitle: 0, body: 16, emphasis: 0}
footer: {show_page_number: true, signature: ""}
